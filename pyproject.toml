
[project]
name = "granite-assets"
version = "0.1.1"
description = "Portable asset repository abstraction for local and cloud storage backends"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "granite-assets contributors" }]
requires-python = ">=3.12"
keywords = ["assets", "storage", "s3", "nginx", "repository", "url", "presigned"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
  "boto3>=1.34",
]

[project.urls]
Homepage = "https://github.com/granite-stack/granite-assets"
Documentation = "https://granite-stack.github.io/granite-assets/"
Repository = "https://github.com/granite-stack/granite-assets"
Issues = "https://github.com/granite-stack/granite-assets/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pysonar>=1.4.0.4676",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "moto[s3]>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "boto3-stubs[s3]>=1.34",
    "bandit>=1.9.2",
    "httpx>=0.28.1",
    "mock>=5.2.0",
    "ruff>=0.14.10",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
]
docs = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-autodoc-typehints>=3.6.2",
    "myst-parser>=5.0.0",
    "sphinx-copybutton>=0.5.2",
    "furo>=2025.12.19",
]

[tool.ruff]
line-length = 88
src = ["src"]  # First, add the source code folder
target-version = "py312"  # Minimum supported version

[tool.ruff.lint]
# Activate additional rules to imitate flake8 and isort
select = [
  "E", "F", "I", "UP", "B", "W", "C90"
]
# Exclude files and folders that are not part of the source code
exclude = ["tests/data", ".venv"]

# Activate autofix for common problems
fixable = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
pretty = true

