# nginx-secure-link.conf — Operator template for granite-assets signed URLs
#
# This file is both a documentation artifact and an envsubst template.
# The ${SECURE_LINK_SECRET} placeholder is replaced at container startup.
#
# ─── Quick start ────────────────────────────────────────────────────────────
#
# 1. Mount this file into the container (read-only):
#
#      volumes:
#        - ./nginx-secure-link.conf:/etc/nginx/nginx.conf.template:ro
#
# 2. Add an entrypoint command that expands the variable:
#
#      command: >
#        /bin/sh -c "
#          envsubst '$$SECURE_LINK_SECRET' < /etc/nginx/nginx.conf.template
#            > /etc/nginx/nginx.conf &&
#          nginx -g 'daemon off;'
#        "
#
# 3. Set SECURE_LINK_SECRET in your environment (never hard-code it):
#
#      SECURE_LINK_SECRET=$(python -c "import secrets; print(secrets.token_urlsafe(32))")
#
# 4. Configure the same secret in your application:
#
#      cfg = LocalNginxAssetRepositoryConfig(
#          storage_path="/srv/assets",
#          base_url="https://media.example.com/assets",
#          secure_link_secret=os.environ["SECURE_LINK_SECRET"],
#          secure_link_ttl_seconds=3600,  # 1 hour default
#      )
#
# ─── Token algorithm ────────────────────────────────────────────────────────
#
# Python:
#   import base64, hashlib, time
#   expires = int(time.time()) + ttl_seconds
#   raw     = f"{expires}{uri_path} {secret}".encode("utf-8")
#   token   = base64.urlsafe_b64encode(hashlib.md5(raw).digest()).rstrip(b"=").decode()
#   url     = f"{base_url}/{prefix}/{key}?md5={token}&expires={expires}"
#
# Nginx (verified to produce identical results):
#   secure_link_md5 "$secure_link_expires$uri ${SECURE_LINK_SECRET}";
#
# ─── Directory layout ───────────────────────────────────────────────────────
#
#   /srv/assets/
#   ├── public/    ← served without a token
#   └── private/   ← requires valid secure_link token
#
# Adjust the `alias` directives below if your layout differs.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format — adjust as needed for your observability stack.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /dev/stdout  main;

    sendfile        on;
    keepalive_timeout 65;

    # ── Required writable temp paths (non-root container support) ────────────
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    server {
        listen 80;
        server_name _;

        # ── HTTPS redirect (uncomment in production) ─────────────────────────
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # if ($scheme = http) { return 301 https://$host$request_uri; }

        # ── Public assets ─────────────────────────────────────────────────────
        # No authentication required.  Cache aggressively — these URLs never
        # change (immutable content should use content-addressed keys).
        location /assets/public/ {
            alias /srv/assets/public/;
            autoindex off;
            add_header Cache-Control "public, max-age=86400, immutable";
        }

        # ── Private assets (secure_link protected) ───────────────────────────
        #
        # Validates ?md5=TOKEN&expires=TIMESTAMP.
        #
        # ${SECURE_LINK_SECRET} is replaced at startup by envsubst.
        # The space before the closing quote is deliberate — it separates the
        # URI from the secret in the HMAC input, matching the Python formula.
        location /assets/private/ {
            # Declare which query params carry the token and its expiry.
            secure_link $arg_md5,$arg_expires;

            # HMAC input: "{expires}{$uri} {secret}"
            # Must match LocalNginxAssetRepository._build_secure_link_token().
            secure_link_md5 "$secure_link_expires$uri ${SECURE_LINK_SECRET}";

            # Missing or cryptographically invalid token → 403 Forbidden.
            if ($secure_link = "") {
                return 403;
            }

            # Valid token but past its expiry → 410 Gone.
            # 410 (not 403) tells the client the URL existed but has expired,
            # so it should request a fresh signed URL from the application.
            if ($secure_link = "0") {
                return 410;
            }

            # Token is valid and not expired — serve the file.
            alias /srv/assets/private/;
            autoindex off;

            # Prevent browsers from caching signed URLs — they expire.
            add_header Cache-Control "private, no-store";
        }

        # ── Catch-all: block direct access to asset root ──────────────────────
        location /assets/ {
            return 403;
        }

        # ── Health check (for Docker healthcheck / load balancer) ─────────────
        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
