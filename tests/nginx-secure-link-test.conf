# Nginx configuration for granite-assets integration tests.
#
# This file is mounted into the testcontainers Nginx container at runtime.
# It is NOT intended for production use — see examples/nginx-secure-link.conf
# for the operator template.
#
# Directory layout expected inside the container:
#
#   /srv/assets/
#   ├── public/      ← publicly accessible, no token needed
#   └── private/     ← requires a valid secure_link token
#
# The secret used here is "test-secret-key".  It must match the value passed
# to LocalNginxAssetRepositoryConfig(secure_link_secret="test-secret-key").

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    # Write access logs to stdout so testcontainers can capture them.
    access_log /dev/stdout;

    # Required temp paths writable by a non-root user inside the container.
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    server {
        listen 80;
        server_name localhost;

        # ── Public assets ────────────────────────────────────────────────────
        # Any file under /assets/public/ is served directly — no token needed.
        location /assets/public/ {
            alias /srv/assets/public/;
            autoindex off;
        }

        # ── Private assets (secure_link protected) ───────────────────────────
        #
        # Validates the ?md5=TOKEN&expires=TIMESTAMP query parameters using the
        # ngx_http_secure_link_module built into standard Nginx distributions.
        #
        # Token formula (must match _build_secure_link_token in local_nginx.py):
        #
        #   raw   = "{expires}{uri} {secret}"
        #   token = base64url(md5(raw))  # no padding
        #
        # $secure_link_expires  → value of ?expires=
        # $uri                  → request URI path (e.g. /assets/private/doc.pdf)
        # "test-secret-key"     → shared secret (matches Python config)
        location /assets/private/ {
            # Parse the two query parameters into Nginx variables.
            secure_link $arg_md5,$arg_expires;

            # Declare the hash input.  Order and spacing must be identical to
            # the Python implementation.
            secure_link_md5 "$secure_link_expires$uri test-secret-key";

            # $secure_link is "" if the token is missing or invalid → 403.
            if ($secure_link = "") {
                return 403;
            }

            # $secure_link is "0" if expires has passed → 410 Gone.
            if ($secure_link = "0") {
                return 410;
            }

            # Token is valid and not expired — serve the file.
            alias /srv/assets/private/;
            autoindex off;
        }
    }
}
